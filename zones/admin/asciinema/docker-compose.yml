name: speedbuild-asciinema

services:
  asciinema:
    image: ghcr.io/asciinema/asciinema-server:${ASCIINEMA_SERVER_TAG:-latest}
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      URL_HOST: 10.61.0.10
      URL_PORT: "4000"
      URL_SCHEME: http
      STREAM_RECORDING: "true"
      DATABASE_URL: postgresql://postgres@postgres/postgres
    volumes:
      - asciinema_uploads:/var/lib/asciinema
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bin/asciinema", "pid"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  asciinema_uploads:
  postgres_data:
